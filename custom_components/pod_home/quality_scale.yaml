# The docs-* rules are assessed against the README.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: todo
    comment: Core keeps brand images in home-assistant/brands; the existing icons already meet its size rules.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: todo
    comment: podpoint-mobile-api is vendored; it needs a PyPI source distribution published from CI with matching tags.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities read coordinator data and subscribe to no events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Chargers are reached through the Pod Point cloud and aren't discoverable on the network.
  discovery-update-info:
    status: exempt
    comment: The integration uses no discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Expired credentials are handled by reauth; there are no other user-fixable states.
  stale-devices:
    status: done
    comment: Charger devices that leave the account are removed on the next poll; other devices can be deleted by hand once they are gone.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: done
    comment: mypy --strict runs in CI on the integration and the library, which ships py.typed.
