[pytest]
# pytest-homeassistant-custom-component registers itself globally once installed (socket
# blocking, a swapped event_loop fixture) - disruptive to the plain offline tests
# (test_helpers.py, test_translation_keys.py), which need neither and ran fine before this
# plugin existed. Disabled by default here; re-enabled only for the HA-dependent test subtree
# via that subtree's own conftest.py (see tests/homeassistant/conftest.py).
# --force-enable-socket: on Windows, asyncio's ProactorEventLoop needs a real loopback
# socket.socketpair() just to construct itself (its internal self-pipe) - pytest-socket's
# default network-call blocking (enabled by the homeassistant plugin below) blocks that too,
# breaking `hass`-fixture setup entirely before any test code runs. Not a concern in practice:
# every real network call in tests/homeassistant/ is mocked at the auth-client boundary anyway.
#
# Bare `pytest` / `pytest tests/` therefore only runs the offline suite (test_helpers.py,
# test_translation_keys.py) - tests/homeassistant/ is excluded by default and needs its own
# explicit invocation, since it needs the plugin re-enabled (see tests/homeassistant/conftest.py):
#     pytest tests/homeassistant/ -p homeassistant
addopts = -p no:homeassistant --force-enable-socket --ignore=tests/homeassistant
# Required for pytest-homeassistant-custom-component's async `hass` fixture to actually be
# awaited before use - without this, fixtures that depend on it (e.g. enable_custom_integrations)
# receive the un-awaited async_generator object instead of a real HomeAssistant instance.
asyncio_mode = auto
