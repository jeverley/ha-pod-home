[pytest]
# pytest-homeassistant-custom-component registers itself globally once installed (socket
# blocking, a swapped event_loop fixture) - disruptive to the plain offline tests
# (test_helpers.py, test_translation_keys.py), which need neither and ran fine before this
# plugin existed. Disabled by default here; re-enabled only for the HA-dependent test subtree via
# that subtree's own conftest.py (see tests/homeassistant/conftest.py) - which must always be run
# as its own separate invocation, so this file's `--ignore` keeps it out of a bare `pytest`/
# `pytest tests/` run entirely:
#     python -m pytest tests/
#     python -m pytest tests/homeassistant/ --force-enable-socket -o asyncio_mode=auto
# (--force-enable-socket/asyncio_mode live on that second command line, not here - both are
# options owned by plugins the offline-only run above never installs, and an unrecognized CLI
# option is a hard error, unlike an unknown ini key. See DECISIONS.md for what each one fixes.)
addopts = -p no:homeassistant --ignore=tests/homeassistant
